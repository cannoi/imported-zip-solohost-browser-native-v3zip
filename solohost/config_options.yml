title: "SoloHost Browser"
eyebrow: SoloHost App
description: "Simple · Private · Lightweight browser with AI."
footer_hint: Set the access password, save, then start the app.
output_file: .env
after_save: Saved. Start or restart the app from SoloHost.
fields:
  - name: BROWSER_ACCESS_PASSWORD
    label: Access password
    type: password
    required: true
    preserve_if_blank: false
    help: "Password required after splash to open the app."

  - name: SOLOHOST_NOVNC_ENABLED
    label: Enable interactive Chromium desktop (noVNC)
    type: boolean
    required: false
    default: false
    help: "Enable only when you need to log in or solve CAPTCHA on the real Chromium desktop."

  - name: NOVNC_VNC_PASSWORD
    label: noVNC desktop password (min 8 characters)
    type: password
    required: false
    preserve_if_blank: true
    help: "Required when noVNC is enabled."
