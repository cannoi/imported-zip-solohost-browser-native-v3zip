services:
  web:
    image: ghcr.io/cannoi/imported-zip-solohost-browser-native-v3zip:1af7b940c186ec977ff75f7838938e0ef0449b7b
    ports:
      - "127.0.0.1:18248:8080"
    environment:
      PORT: "8080"
      HOST: "0.0.0.0"
      BROWSER_ACCESS_PASSWORD: "${BROWSER_ACCESS_PASSWORD}"
      SOLOHOST_NOVNC_ENABLED: "1"
      SOLOHOST_NOVNC_PORT: "6080"
      NOVNC_VNC_PASSWORD: ""
      SOLOHOST_BROWSER_HEADFUL: "0"
      HOME: "/tmp/solohost-browser"
      SOLOHOST_PLAYWRIGHT: "1"
      SOLOHOST_BROWSER_ENGINE: "chromium"
      SOLOHOST_BROWSER_PERSIST_SESSIONS: "1"
      SOLOHOST_BROWSER_CONTENT_MODE: "adaptive"
      SOLOHOST_BROWSER_BLOCK_ADS: "1"
      SOLOHOST_WEBKIT: "0"
      SOLOHOST_DATA_DIR: "/app/data"
      ACCESS_PASSWORD: ${ACCESS_PASSWORD}
      AI_API_KEY: ${AI_API_KEY}
      AI_BASE_URL: ${AI_BASE_URL}
      AI_DEBUG: ${AI_DEBUG}
      AI_EXTRA_HEADERS: ${AI_EXTRA_HEADERS}
      AI_MODE: ${AI_MODE}
      AI_MODEL: ${AI_MODEL}
      AI_PROVIDER: ${AI_PROVIDER}
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL}
      OLLAMA_MODEL: ${OLLAMA_MODEL}
      OLLAMA_URL: ${OLLAMA_URL}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL}
      OPENAI_MODEL: ${OPENAI_MODEL}
      SHFH_APP_ID: ${SHFH_APP_ID}
      SHFH_APP_NAME: ${SHFH_APP_NAME}
      SHFH_APP_VERSION: ${SHFH_APP_VERSION}
      SHFH_HUB_ID: ${SHFH_HUB_ID}
      SHFH_HUB_URL: ${SHFH_HUB_URL}
      SHFH_INGEST_TOKEN: ${SHFH_INGEST_TOKEN}
      SOLOHOST_AI_COMPAT_TIMEOUT_MS: ${SOLOHOST_AI_COMPAT_TIMEOUT_MS}
      SOLOHOST_APP_MANAGER_URL: ${SOLOHOST_APP_MANAGER_URL}
      SOLOHOST_BRIDGE_MAX_HTML: ${SOLOHOST_BRIDGE_MAX_HTML}
      SOLOHOST_BRIDGE_MAX_SESSIONS: ${SOLOHOST_BRIDGE_MAX_SESSIONS}
      SOLOHOST_BRIDGE_RATE: ${SOLOHOST_BRIDGE_RATE}
      SOLOHOST_BRIDGE_TTL_MS: ${SOLOHOST_BRIDGE_TTL_MS}
      SOLOHOST_BROWSER_LOCALE: ${SOLOHOST_BROWSER_LOCALE}
      SOLOHOST_BROWSER_MOBILE: ${SOLOHOST_BROWSER_MOBILE}
      SOLOHOST_BROWSER_PROFILE_DIR: ${SOLOHOST_BROWSER_PROFILE_DIR}
      SOLOHOST_BROWSER_STATE_SAVE_INTERVAL_MS: ${SOLOHOST_BROWSER_STATE_SAVE_INTERVAL_MS}
      SOLOHOST_BROWSER_TIMEZONE: ${SOLOHOST_BROWSER_TIMEZONE}
      SOLOHOST_DEMO_APPS: ${SOLOHOST_DEMO_APPS}
      SOLOHOST_ENGINE_TOKEN: ${SOLOHOST_ENGINE_TOKEN}
      SOLOHOST_PW_MAX_SESSIONS: ${SOLOHOST_PW_MAX_SESSIONS}
      SOLOHOST_PW_NAV_TIMEOUT_MS: ${SOLOHOST_PW_NAV_TIMEOUT_MS}
      SOLOHOST_REGISTRY_FILE: ${SOLOHOST_REGISTRY_FILE}
      SOLOHOST_VNC_GEOMETRY: ${SOLOHOST_VNC_GEOMETRY}
      SOLOHOST_WEBKIT_ALLOW_LOOPBACK: ${SOLOHOST_WEBKIT_ALLOW_LOOPBACK}
      SOLOHOST_WEBKIT_BRIDGE: ${SOLOHOST_WEBKIT_BRIDGE}
      SOLOHOST_WEBKIT_DISPLAY: ${SOLOHOST_WEBKIT_DISPLAY}
      SOLOHOST_WEBKIT_IPC_TIMEOUT_MS: ${SOLOHOST_WEBKIT_IPC_TIMEOUT_MS}
      SOLOHOST_WEBKIT_MAX_SESSIONS: ${SOLOHOST_WEBKIT_MAX_SESSIONS}
      SOLOHOST_WEBKIT_NAV_TIMEOUT_MS: ${SOLOHOST_WEBKIT_NAV_TIMEOUT_MS}
      SOLOHOST_WEBKIT_PERSIST_COOKIES: ${SOLOHOST_WEBKIT_PERSIST_COOKIES}
      SOLOHOST_WEBKIT_WORKER_ID: ${SOLOHOST_WEBKIT_WORKER_ID}
    restart: unless-stopped
    labels:
      pi.ui.primary: "true"
    volumes:
      - solohost-browser-data:/app/data

volumes:
  solohost-browser-data:
