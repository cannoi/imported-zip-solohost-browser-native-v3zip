services:
  web:
    image: ghcr.io/cannoi/imported-zip-solohost-browser-native-v3zip:latest
    ports:
      - "8080:8080"
      - "6080:6080"
    environment:
      PORT: "8080"
      HOST: "0.0.0.0"
      BROWSER_ACCESS_PASSWORD: "${BROWSER_ACCESS_PASSWORD}"
      SOLOHOST_NOVNC_ENABLED: "1"
      SOLOHOST_NOVNC_PORT: "6080"
      NOVNC_VNC_PASSWORD: ""
      SOLOHOST_BROWSER_HEADFUL: "1"
      HOME: "/tmp/solohost-browser"
      SOLOHOST_PLAYWRIGHT: "1"
      SOLOHOST_BROWSER_ENGINE: "chromium"
      SOLOHOST_BROWSER_PERSIST_SESSIONS: "1"
      SOLOHOST_BROWSER_CONTENT_MODE: "adaptive"
      SOLOHOST_BROWSER_BLOCK_ADS: "1"
      SOLOHOST_WEBKIT: "0"
      SOLOHOST_DATA_DIR: "/app/data"
    restart: unless-stopped
    labels:
      pi.ui.primary: "true"
    volumes:
      - solohost-browser-data:/app/data

volumes:
  solohost-browser-data:
