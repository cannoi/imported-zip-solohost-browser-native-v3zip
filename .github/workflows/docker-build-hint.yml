# Optional reference for faster rebuilds when SoloHost/GitHub uses this repo workflow.
# SoloHost App Builder may use its own pipeline; keep this as cache-friendly template.
name: docker-cache-hint
on:
  workflow_dispatch:
jobs:
  hint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: ghcr.io/${{ github.repository }}:buildcache
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Prefer also: cache-from: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache
