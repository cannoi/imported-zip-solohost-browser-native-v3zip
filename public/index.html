<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0c0d10">
  <meta name="color-scheme" content="dark">
  <title>SoloHost</title>
  <link rel="stylesheet" href="style.css?v=7.9.0">
  <style>
    html,body{background:#0c0d10;color:#eceae6;margin:0;min-height:100%;}
    .paf-made-by{position:fixed;right:10px;bottom:10px;width:min(64px,11vw);max-width:11vw;height:auto;object-fit:contain;opacity:.42;background:transparent;padding:0;border:0;box-shadow:none;filter:none;pointer-events:none;z-index:40}
  </style>
<style>.paf-made-by{position:fixed;right:8px;bottom:8px;width:min(72px,12vw);max-width:12vw;height:auto;object-fit:contain;opacity:.5;background:transparent;padding:0;border:0;box-shadow:none;filter:none;pointer-events:none;z-index:30}</style></head>
<body>
  <div class="atmosphere" aria-hidden="true">
    <div class="wash"></div>
    <div class="radial"></div>
    <div class="grain"></div>
    <div class="pointer-glow" id="pointer-glow"></div>
  </div>

  <a class="skip" href="#search-input">Skip to search</a>

  <header class="chrome" id="chrome">
    <div class="nav-float" role="toolbar" aria-label="Navigation">
      <button type="button" id="btn-back" title="Back" aria-label="Back">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M15.4 5.3 8.7 12l6.7 6.7 1.2-1.2L11.1 12l5.5-5.5z"/></svg>
      </button>
      <button type="button" id="btn-forward" title="Forward" aria-label="Forward">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="m8.6 5.3 6.7 6.7-6.7 6.7-1.2-1.2L13.9 12 7.4 6.5z"/></svg>
      </button>
      <button type="button" id="btn-reload" title="Reload" aria-label="Reload">
        <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path fill="currentColor" d="M12 6V3L8 7l4 4V8a4 4 0 1 1-3.5 5.8l-1.4.9A5.7 5.7 0 1 0 12 6z"/></svg>
      </button>
    </div>

    <div class="tabs-float" id="tabs" role="tablist" aria-label="Open surfaces"></div>

    <button type="button" id="btn-new" class="orb-btn" title="New tab" aria-label="New tab">＋</button>
    <a id="btn-downloads" class="orb-btn" href="/downloads" target="_blank" rel="noopener" title="Downloads" aria-label="Downloads">↓</a>
    <a id="btn-security" class="orb-btn" href="/security" target="_blank" rel="noopener" title="Security & Privacy" aria-label="Security & Privacy">🛡</a>
      </header>

  <main class="stage" id="stage">
    <section class="view home" id="view-home" data-view="home">
      <div class="home-column">
        <p class="brand" id="brand">SoloHost</p>
        <h1 class="greeting" id="greeting">Good evening</h1>

        <form class="search-surface" id="search-form" role="search" autocomplete="off">
          <button type="submit" class="search-orb" aria-label="Search">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
              <circle cx="11" cy="11" r="6.2" fill="none" stroke="currentColor" stroke-width="1.6"/>
              <path d="m16 16 4 4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
            </svg>
          </button>
          <label class="sr-only" for="search-input">Search or enter website</label>
          <input
            id="search-input"
            name="q"
            type="text"
            placeholder="Search the Web"
            spellcheck="false"
            enterkeyhint="go"
          >
        </form>
        <div class="suggest" id="suggest" hidden></div>
      </div>

      <div class="sky" id="sky">
        <div class="constellation" id="constellation" aria-label="My Apps"></div>
      </div>

      <p class="status-line" id="status-line">
        <span>SoloHost</span>
        <span class="sep">•</span>
        <span id="status-text">Online</span>
      </p>
    </section>

    <section class="view browser" id="view-browser" hidden>
      <iframe id="browser-view" class="browser-view" title="WebKit" allow="clipboard-read; clipboard-write; fullscreen; autoplay" allowfullscreen></iframe>
      <canvas id="browser-canvas" class="browser-canvas" hidden aria-hidden="true"></canvas>
      <div class="media-controls" id="media-controls" role="toolbar" aria-label="Media controls">
        <button type="button" id="media-play" title="Play / Pause" aria-label="Play or pause media">▶ / Ⅱ</button>
        <button type="button" id="media-mute" title="Mute / Unmute" aria-label="Mute or unmute media">🔊</button>
        <label for="media-volume" title="Volume">🔉</label><input id="media-volume" type="range" min="0" max="1" step="0.05" value="0.8" aria-label="Volume">
        <button type="button" id="media-captions" title="Subtitles" aria-label="Toggle subtitles">CC</button>
        <button type="button" id="media-fullscreen" title="Video fullscreen" aria-label="Toggle video fullscreen">⛶</button>
      </div>
      <div class="browser-error" id="browser-error" hidden role="alert">
        <svg class="browser-error-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
          <path d="M4.9 15.5a10 10 0 0 1 14.2 0M1.4 11.9a15 15 0 0 1 21.2 0M8.5 19a5 5 0 0 1 7 0M12 20h.01"/>
          <line x1="2.5" y1="2.5" x2="21.5" y2="21.5"/>
        </svg>
        <p class="browser-error-title" id="browser-error-title">Page unavailable</p>
        <p class="browser-error-desc" id="browser-error-desc">This address could not be opened.</p>
        <button type="button" class="browser-error-retry" id="browser-error-retry">Retry</button>
      </div>
      <div class="findbar" id="findbar" hidden role="search" aria-label="Find in page">
        <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><circle cx="11" cy="11" r="6.2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="m16 16 4 4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        <label class="sr-only" for="find-input">Find in page</label>
        <input id="find-input" type="text" placeholder="Find on page" autocomplete="off" spellcheck="false" enterkeyhint="search">
        <span class="find-status" id="find-status" aria-live="polite"></span>
        <button type="button" id="find-prev" title="Previous match" aria-label="Previous match">
          <svg viewBox="0 0 24 24" width="12" height="12" aria-hidden="true"><path fill="currentColor" d="M12 8 6 14h12z"/></svg>
        </button>
        <button type="button" id="find-next" title="Next match" aria-label="Next match">
          <svg viewBox="0 0 24 24" width="12" height="12" aria-hidden="true"><path fill="currentColor" d="M12 16 6 10h12z"/></svg>
        </button>
        <button type="button" id="find-close" title="Close" aria-label="Close find bar">
          <svg viewBox="0 0 24 24" width="11" height="11" aria-hidden="true"><path stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none" d="M5 5l14 14M19 5 5 19"/></svg>
        </button>
      </div>
    </section>
  </main>

  <link rel="stylesheet" href="ai-panel.css?v=7.9.0">
  <button type="button" class="ai-fab" id="aiFab" title="AI · Feedback · Settings" aria-label="AI">
    <img src="/ai-icon.png" alt="AI" class="ai-fab-img">
    <span class="ai-fab-dot" id="aiStatusDot"></span>
    <span class="ai-badge" id="aiBadge" hidden style="display:none"></span>
  </button>

  <div class="panel-overlay" id="aiOverlay" hidden style="z-index:400">
    <div class="panel ai-panel" id="aiPanel">
      <div class="panel-header">
        <span class="panel-title">✦ AI</span>
        <button type="button" class="panel-close" id="aiClose" aria-label="Close">×</button>
      </div>
      <div class="panel-tabs" id="panelTabs">
        <button type="button" class="tab active" data-tab="chat">Chat</button>
        <button type="button" class="tab" data-tab="feedback">Feedback <span class="tab-badge" id="fbTabBadge" hidden></span></button>
        <button type="button" class="tab" data-tab="settings">Settings</button>
        <button type="button" class="tab" data-tab="logs">Logs</button>
      </div>
      <div class="tab-pane active" id="tab-chat">
        <div class="panel-body" id="aiChat"></div>
        <div class="panel-footer">
          <input type="text" id="aiInput" placeholder="Ask about SoloHost Browser…" autocomplete="off" enterkeyhint="send">
          <button type="button" id="aiSend" aria-label="Send">➤</button>
        </div>
        <div class="ai-status-bar" id="aiStatusBar">AI: checking…</div>
      </div>
      <div class="tab-pane" id="tab-feedback">
        <div class="panel-body fb-body">
          <div id="fbNotices" class="fb-notices"></div>
          <div id="fbDonate" class="fb-donate" hidden></div>
          <label class="fb-label">Type</label>
          <select id="fbType">
            <option value="improvement">Improvement</option>
            <option value="bug">Bug</option>
            <option value="question">Question</option>
          </select>
          <label class="fb-label">Rating</label>
          <div class="fb-stars" id="fbStars">
            <button type="button" data-r="1">★</button>
            <button type="button" data-r="2">★</button>
            <button type="button" data-r="3">★</button>
            <button type="button" data-r="4">★</button>
            <button type="button" data-r="5">★</button>
          </div>
          <label class="fb-label">Message</label>
          <textarea id="fbMessage" rows="3" placeholder="Your feedback…" maxlength="2000"></textarea>
          <p class="fb-hint">No password or API key needed for feedback.</p>
          <button type="button" class="fb-submit" id="fbSubmit">Send Feedback</button>
          <p class="fb-status" id="fbStatus"></p>
        </div>
      </div>
      <div class="tab-pane" id="tab-settings">
        <div class="panel-body settings-body">
          <label class="fb-label">Provider</label>
          <select id="setProvider">
            <option value="none">— None —</option>
            <option value="openai">OpenAI</option>
            <option value="gemini">Google Gemini</option>
            <option value="deepseek">DeepSeek</option>
            <option value="anthropic">Anthropic</option>
            <option value="openrouter">OpenRouter</option>
            <option value="groq">Groq</option>
            <option value="mistral">Mistral</option>
            <option value="xai">xAI</option>
            <option value="custom">Custom OpenAI-compatible</option>
            <option value="local">Local OpenAI-compatible</option>
          </select>
          <label class="fb-label">API Key</label>
          <input type="password" id="setApiKey" placeholder="sk-… (hidden after save)" autocomplete="off">
          <p class="fb-hint" id="setKeyHint">Key: (none)</p>
          <label class="fb-label">Base URL <small>(Custom / Local)</small></label>
          <input type="text" id="setBaseUrl" placeholder="https://api.example.com/v1">
          <label class="fb-label">Model</label>
          <input type="text" id="setModel" placeholder="auto" value="auto">
          <label class="fb-label">Mode</label>
          <select id="setMode">
            <option value="cloud_enabled">Cloud Enabled</option>
            <option value="prefer_local">Prefer Local</option>
            <option value="local_only">Local Only</option>
            <option value="balanced">Balanced</option>
            <option value="custom">Custom</option>
          </select>
          <div class="row" style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px">
            <button type="button" class="fb-submit" id="setSave">Save Settings</button>
            <button type="button" class="ws-btn" id="setTest">Check token</button>
            <button type="button" class="ws-btn" id="setModels">Load models</button>
          </div>
          <p class="fb-status" id="setStatus"></p>
        </div>
      </div>
      <div class="tab-pane" id="tab-logs">
        <div class="panel-body" id="aiLogs" style="font-family:ui-monospace,monospace;font-size:11px;white-space:pre-wrap"></div>
        <div class="panel-footer">
          <button type="button" class="ws-btn" id="logsRefresh">Refresh</button>
          <button type="button" class="ws-btn" id="logsClear">Clear</button>
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="app.js?v=7.9.0"></script>
  <script src="/ai-module/ai-module.js?v=7.9.0"></script>
  <script src="/feedback-module/feedback-module.js?v=7.9.0"></script>
  <script src="/ai-panel.js?v=7.9.0"></script>
  <img class="paf-made-by" src="made-by.png" alt="">
</body>
</html>
