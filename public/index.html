<!DOCTYPE html>
<html lang="en" data-theme="rainbow">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <title>SoloHost Browser</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/ai-panel.css">
</head>
<body class="browser-shell">
  <header class="chrome" role="banner">
    <div class="chrome-nav">
      <button type="button" class="icon-btn" id="btn-back" title="Back" aria-label="Back">←</button>
      <button type="button" class="icon-btn" id="btn-fwd" title="Forward" aria-label="Forward">→</button>
      <button type="button" class="icon-btn" id="btn-reload" title="Reload" aria-label="Reload">↻</button>
    </div>
    <form class="omnibox" id="nav-form" action="javascript:void(0)" autocomplete="off">
      <span class="omnibox-lock" aria-hidden="true">◎</span>
      <input type="text" id="url-input" placeholder="Search or enter address" spellcheck="false" enterkeyhint="go">
      <button type="submit" class="icon-btn go" id="btn-go" title="Go" aria-label="Go">→</button>
    </form>
    <div class="chrome-actions">
      <button type="button" class="icon-btn" id="btn-bookmark" title="Bookmark" aria-label="Bookmark">☆</button>
      <button type="button" class="icon-btn" id="btn-library" title="History and bookmarks" aria-label="History and bookmarks">☷</button>
      <button type="button" class="icon-btn" id="btn-new-tab" title="New tab" aria-label="New tab">＋</button>
      <button type="button" class="icon-btn" id="btn-reader" title="Reader" aria-label="Reader">📖</button>
      <button type="button" class="icon-btn" id="btn-summary" title="Summarize" aria-label="Summarize">⚡</button>
      <button type="button" class="icon-btn" id="btn-translate" title="Translate" aria-label="Translate">🌐</button>
      <button type="button" class="icon-btn" id="btn-theme" title="Theme" aria-label="Theme">◐</button>
      <button type="button" class="icon-btn" id="btn-lang" title="Language" aria-label="Language">EN</button>
      <a class="icon-btn" id="btn-open-tab" href="#" target="_blank" rel="noopener noreferrer" title="Open" aria-label="Open">↗</a>
    </div>
  </header>

  <nav class="tab-strip" id="tab-strip" aria-label="Browser tabs"></nav>
  <main class="viewport" id="viewport">
    <iframe
      id="main-webview"
      name="main-webview"
      title="Page"
      src="about:blank"
      referrerpolicy="no-referrer-when-downgrade"
      allow="accelerometer; autoplay; clipboard-read; clipboard-write; encrypted-media; fullscreen; geolocation; microphone; camera; payment; picture-in-picture"
      allowfullscreen
    ></iframe>
    <div class="start-screen" id="start-screen">
      <div class="start-inner">
        <div class="start-mark">S</div>
        <h1>SoloHost</h1>
        <p id="start-sub">Simple · Private · Lightweight</p>
      </div>
    </div>
  </main>

  <div class="library-overlay" id="library-overlay" hidden>
    <section class="library-panel" role="dialog" aria-modal="true" aria-labelledby="library-title">
      <header class="library-header"><strong id="library-title">Library</strong><button type="button" id="library-close" class="icon-btn" aria-label="Close">×</button></header>
      <div class="library-tabs"><button type="button" data-library="bookmarks" class="active">☆ Bookmarks</button><button type="button" data-library="history">◷ History</button></div>
      <div id="library-list" class="library-list"></div>
      <footer class="library-footer"><button type="button" id="history-clear">Clear history</button></footer>
    </section>
  </div>

  <!-- Universal AI FAB + Panel (Snake Arcade pattern) -->
  <button type="button" class="ai-fab" id="aiFab" title="AI · Feedback · Settings" aria-label="AI">
    <img src="/ai-icon.png" alt="AI" class="ai-fab-img">
    <span class="ai-fab-dot" id="aiStatusDot"></span>
    <span class="ai-badge" id="aiBadge" hidden style="display:none"></span>
  </button>
  <div class="panel-overlay" id="aiOverlay" hidden style="z-index:400">
    <div class="panel ai-panel" id="aiPanel">
      <div class="panel-header">
        <span class="panel-title">✦ AI</span>
        <button type="button" class="panel-close" id="aiClose" aria-label="Close">×</button>
      </div>
      <div class="panel-tabs" id="panelTabs">
        <button type="button" class="tab active" data-tab="chat">Chat</button>
        <button type="button" class="tab" data-tab="feedback">Feedback <span class="tab-badge" id="fbTabBadge" hidden></span></button>
        <button type="button" class="tab" data-tab="settings">Settings</button>
        <button type="button" class="tab" data-tab="logs">Logs</button>
      </div>
      <div class="tab-pane active" id="tab-chat">
        <div class="panel-body" id="aiChat"></div>
        <div class="panel-footer">
          <input type="text" id="aiInput" placeholder="Ask about browsing, privacy, AI…" autocomplete="off" enterkeyhint="send">
          <button type="button" id="aiSend" aria-label="Send">➤</button>
        </div>
        <div class="ai-status-bar" id="aiStatusBar">AI: checking…</div>
      </div>
      <div class="tab-pane" id="tab-feedback">
        <div class="panel-body fb-body">
          <div id="fbNotices" class="fb-notices"></div>
          <div id="fbDonate" class="fb-donate" hidden></div>
          <label class="fb-label">Type</label>
          <select id="fbType">
            <option value="improvement">Improvement</option>
            <option value="bug">Bug</option>
            <option value="question">Question</option>
          </select>
          <label class="fb-label">Rating</label>
          <div class="fb-stars" id="fbStars">
            <button type="button" data-r="1">★</button>
            <button type="button" data-r="2">★</button>
            <button type="button" data-r="3">★</button>
            <button type="button" data-r="4">★</button>
            <button type="button" data-r="5">★</button>
          </div>
          <label class="fb-label">Message</label>
          <textarea id="fbMessage" rows="4" placeholder="Your feedback…"></textarea>
          <button type="button" class="fb-submit" id="fbSubmit">Send feedback</button>
          <p class="fb-status" id="fbStatus"></p>
        </div>
      </div>
      <div class="tab-pane" id="tab-settings">
        <div class="panel-body fb-body">
          <label class="fb-label">Provider</label>
          <select id="setProvider">
            <option value="none">— None —</option>
            <option value="openai">OpenAI</option>
            <option value="gemini">Google Gemini</option>
            <option value="deepseek">DeepSeek</option>
            <option value="anthropic">Anthropic</option>
            <option value="openrouter">OpenRouter</option>
            <option value="groq">Groq</option>
            <option value="mistral">Mistral</option>
            <option value="xai">xAI</option>
            <option value="custom">Custom OpenAI-compatible</option>
            <option value="local">Local OpenAI-compatible</option>
          </select>
          <label class="fb-label">API Key</label>
          <input type="password" id="setApiKey" placeholder="sk-… (hidden after save)" autocomplete="off">
          <p class="fb-hint" id="setKeyHint">Current key: (none)</p>
          <label class="fb-label">Base URL <small>(required for Custom / Local)</small></label>
          <input type="text" id="setBaseUrl" placeholder="https://api.example.com/v1">
          <label class="fb-label">Model</label>
          <input type="text" id="setModel" placeholder="auto" value="auto">
          <label class="fb-label">Mode</label>
          <select id="setMode">
            <option value="cloud_enabled">Cloud Enabled</option>
            <option value="prefer_local">Prefer Local</option>
            <option value="local_only">Local Only</option>
            <option value="balanced">Balanced</option>
            <option value="custom">Custom</option>
          </select>
          <div class="row" style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px">
            <button type="button" class="fb-submit" id="setSave">Save Settings</button>
            <button type="button" class="ws-btn" id="setTest">Check token</button>
            <button type="button" class="ws-btn" id="setModels">Load models</button>
            <button type="button" class="ws-btn" id="setRefreshModels">Refresh models</button>
          </div>
          <p class="fb-status" id="setStatus"></p>
          <p class="fb-hint" id="setModelsHint"></p>
        </div>
      </div>
      <div class="tab-pane" id="tab-logs">
        <div class="panel-body logs-body">
          <div class="logs-toolbar">
            <button type="button" class="ws-btn" id="logsRefresh">Refresh</button>
            <button type="button" class="ws-btn" id="logsClear">Clear</button>
          </div>
          <pre id="logsView" class="logs-view">Loading…</pre>
        </div>
      </div>
    </div>
  </div>

  <script src="/ai-module/ai-module.js"></script>
  <script src="/feedback-module/feedback-module.js"></script>
  <script src="/reader-injector.js"></script>
  <script src="/app.js"></script>
  <script src="/ai-panel.js"></script>
</body>
</html>
