<!DOCTYPE html>
<html lang="en" data-theme="rainbow">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <title>SoloHost Browser</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/ai-panel.css">
</head>
<body class="browser-shell">
  <header class="chrome" role="banner">
    <div class="chrome-nav">
      <button type="button" class="icon-btn" id="btn-back" title="Back" aria-label="Back">←</button>
      <button type="button" class="icon-btn" id="btn-fwd" title="Forward" aria-label="Forward">→</button>
      <button type="button" class="icon-btn" id="btn-reload" title="Reload" aria-label="Reload">↻</button>
    </div>
    <form class="omnibox" id="nav-form" action="javascript:void(0)" autocomplete="off">
      <span class="omnibox-lock" aria-hidden="true">◎</span>
      <input type="text" id="url-input" placeholder="Search or enter address" spellcheck="false" enterkeyhint="go">
      <button type="submit" class="icon-btn go" id="btn-go" title="Go" aria-label="Go">→</button>
    </form>
    <div class="chrome-actions">
      <button type="button" class="icon-btn" id="btn-reader" title="Reader" aria-label="Reader">📖</button>
      <button type="button" class="icon-btn" id="btn-summary" title="Summarize" aria-label="Summarize">⚡</button>
      <button type="button" class="icon-btn" id="btn-translate" title="Translate" aria-label="Translate">🌐</button>
      <button type="button" class="icon-btn" id="btn-theme" title="Theme" aria-label="Theme">◐</button>
      <button type="button" class="icon-btn" id="btn-lang" title="Language" aria-label="Language">EN</button>
      <a class="icon-btn" id="btn-open-tab" href="#" target="_blank" rel="noopener noreferrer" title="Open" aria-label="Open">↗</a>
    </div>
  </header>

  <main class="viewport" id="viewport">
    <iframe
      id="main-webview"
      name="main-webview"
      title="Page"
      src="about:blank"
      referrerpolicy="no-referrer-when-downgrade"
      allow="accelerometer; autoplay; clipboard-read; clipboard-write; encrypted-media; fullscreen; geolocation; microphone; camera; payment; picture-in-picture"
    ></iframe>
    <div class="start-screen" id="start-screen">
      <div class="start-inner">
        <div class="start-mark">S</div>
        <h1>SoloHost</h1>
        <p id="start-sub">Simple · Private · Lightweight</p>
      </div>
    </div>
  </main>

  <button type="button" class="ai-fab" id="aiFab" title="AI" aria-label="AI">
    <img src="/ai-icon.png" alt="" class="ai-fab-img">
    <span class="ai-fab-dot" id="aiStatusDot"></span>
    <span class="ai-badge" id="aiBadge" hidden style="display:none"></span>
  </button>
  <div class="panel-overlay" id="aiOverlay" hidden>
    <div class="panel ai-panel" id="aiPanel">
      <div class="panel-header">
        <span class="panel-title">✦ AI</span>
        <button type="button" class="panel-close" id="aiClose" aria-label="Close">×</button>
      </div>
      <div class="panel-tabs" id="panelTabs">
        <button type="button" class="tab active" data-tab="chat">Chat</button>
        <button type="button" class="tab" data-tab="feedback">Feedback <span class="tab-badge" id="fbTabBadge" hidden></span></button>
        <button type="button" class="tab" data-tab="settings">Settings</button>
        <button type="button" class="tab" data-tab="logs">Logs</button>
      </div>
      <div class="tab-pane active" id="tab-chat">
        <div class="panel-body" id="aiChat"></div>
        <div class="panel-footer">
          <input type="text" id="aiInput" placeholder="Ask…" autocomplete="off" enterkeyhint="send">
          <button type="button" id="aiSend" aria-label="Send">➤</button>
        </div>
      </div>
      <div class="tab-pane" id="tab-feedback" hidden></div>
      <div class="tab-pane" id="tab-settings" hidden></div>
      <div class="tab-pane" id="tab-logs" hidden></div>
    </div>
  </div>

  <script src="/reader-injector.js"></script>
  <script src="/app.js"></script>
  <script src="/ai-panel.js"></script>
</body>
</html>
