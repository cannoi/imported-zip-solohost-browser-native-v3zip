<!DOCTYPE html>
<html lang="en" data-theme="rainbow">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <title>SoloHost Browser</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/ai-panel.css">
</head>
<body class="browser-shell">
  <header class="chrome chrome-top" role="banner">
    <form class="omnibox" id="nav-form" action="javascript:void(0)" autocomplete="off">
      <span class="omnibox-lock" aria-hidden="true">◎</span>
      <input type="text" id="url-input" placeholder="Search or enter address" spellcheck="false" enterkeyhint="go">
      <button type="submit" class="icon-btn go" id="btn-go" title="Go" aria-label="Go">→</button>
    </form>
    <div class="chrome-actions">
      <button type="button" class="icon-btn" id="btn-new-tab" title="New tab" aria-label="New tab">＋</button>
      <button type="button" class="icon-btn" id="btn-bookmark" title="Bookmark" aria-label="Bookmark">☆</button>
      <button type="button" class="icon-btn" id="btn-menu" title="Settings" aria-label="Settings" aria-expanded="false" aria-controls="settings-menu">☰</button>
      <a class="icon-btn" id="btn-open-tab" href="#" target="_blank" rel="noopener noreferrer" title="Open" aria-label="Open">↗</a>
    </div>
  </header>

  <nav class="tab-strip" id="tab-strip" aria-label="Browser tabs"></nav>

  <main class="viewport" id="viewport">
    <iframe
      id="main-webview"
      name="main-webview"
      title="Page"
      src="about:blank"
      referrerpolicy="strict-origin-when-cross-origin"
      allow="autoplay; encrypted-media; fullscreen; picture-in-picture"
      allowfullscreen
    ></iframe>
    <div class="start-screen" id="start-screen">
      <div class="start-inner">
        <div class="start-mark">S</div>
        <h1>SoloHost</h1>
        <p id="start-sub">Simple · Private · Lightweight</p>
      </div>
    </div>
  </main>

  <nav class="chrome chrome-bottom" role="navigation" aria-label="Navigation">
    <button type="button" class="icon-btn" id="btn-back" title="Back" aria-label="Back">←</button>
    <button type="button" class="icon-btn" id="btn-fwd" title="Next" aria-label="Next">→</button>
    <button type="button" class="icon-btn" id="btn-home" title="Home" aria-label="Home">⌂</button>
    <button type="button" class="icon-btn" id="btn-reload" title="Reload" aria-label="Reload">↻</button>
  </nav>

  <div class="more-backdrop" id="settings-backdrop" hidden></div>
  <div class="more-menu" id="settings-menu" hidden role="menu">
    <button type="button" id="btn-theme" role="menuitem">◐ Theme</button>
    <button type="button" id="btn-library" role="menuitem">☷ History &amp; bookmarks</button>
    <button type="button" id="btn-reader" role="menuitem">📖 Reader</button>
    <button type="button" id="btn-summary" role="menuitem">⚡ Summarize</button>
    <button type="button" id="btn-translate" role="menuitem">🌐 Translate</button>
    <button type="button" id="btn-lang" role="menuitem">EN</button>
  </div>

  <div class="library-overlay" id="library-overlay" hidden>
    <section class="library-panel" role="dialog" aria-modal="true" aria-labelledby="library-title">
      <header class="library-header"><strong id="library-title">Library</strong><button type="button" id="library-close" class="icon-btn" aria-label="Close">×</button></header>
      <div class="library-tabs"><button type="button" data-library="bookmarks" class="active">☆ Bookmarks</button><button type="button" data-library="history">◷ History</button></div>
      <div id="library-list" class="library-list"></div>
      <footer class="library-footer"><button type="button" id="history-clear">Clear history</button></footer>
    </section>
  </div>

  <button type="button" class="ai-fab" id="aiFab" title="AI · Feedback · Settings" aria-label="AI">
    <img src="/ai-icon.png" alt="AI" class="ai-fab-img">
    <span class="ai-fab-dot" id="aiStatusDot"></span>
    <span class="ai-badge" id="aiBadge" hidden style="display:none"></span>
  </button>
  <div class="panel-overlay" id="aiOverlay" hidden style="z-index:400">
    <div class="panel ai-panel" id="aiPanel">
      <div class="panel-header">
        <span class="panel-title">✦ AI</span>
        <button type="button" class="panel-close" id="aiClose" aria-label="Close">×</button>
      </div>
      <div class="panel-tabs" id="panelTabs">
        <button type="button" class="tab active" data-tab="chat">Chat</button>
        <button type="button" class="tab" data-tab="feedback">Feedback <span class="tab-badge" id="fbTabBadge" hidden></span></button>
        <button type="button" class="tab" data-tab="settings">Settings</button>
        <button type="button" class="tab" data-tab="logs">Logs</button>
      </div>
      <div class="panel-body">
        <div class="tab-pane active" id="pane-chat">
          <div class="chat-log" id="chatLog"></div>
          <form class="chat-form" id="chatForm">
            <input type="text" id="chatInput" placeholder="Ask anything…" autocomplete="off">
            <button type="submit" id="chatSend">Send</button>
          </form>
        </div>
        <div class="tab-pane" id="pane-feedback" hidden>
          <div class="fb-body" style="padding:10px;overflow:auto;flex:1;min-height:0">
            <p style="opacity:.8;font-size:13px;margin:0 0 8px">Send feedback to the author. Notices from the Hub appear below.</p>
            <label style="display:block;font-size:12px;opacity:.75;margin-top:8px">Type</label>
            <select id="fbType" style="width:100%;min-height:40px;margin:4px 0 8px;padding:8px;border-radius:8px;background:#120f22;color:#fff;border:1px solid #445">
              <option value="improvement">Improvement</option>
              <option value="bug">Bug</option>
              <option value="question">Question</option>
              <option value="praise">Praise</option>
            </select>
            <label style="display:block;font-size:12px;opacity:.75">Message</label>
            <textarea id="fbMessage" rows="4" style="width:100%;margin:4px 0 8px;padding:8px;border-radius:8px;background:#120f22;color:#fff;border:1px solid #445;resize:vertical"></textarea>
            <button type="button" id="fbSend" style="min-height:40px;padding:0 16px;border-radius:10px;border:0;background:#3b82f6;color:#fff;font-weight:600;cursor:pointer">Send feedback</button>
            <p id="fbStatus" style="font-size:13px;opacity:.85;margin-top:8px"></p>
            <div id="fbDonate" class="fb-donate" hidden></div>
            <div id="fbNotices" class="fb-notes"></div>
          </div>
        </div>
        <div class="tab-pane" id="pane-settings" hidden>
          <div class="settings-body" style="padding:10px;overflow:auto;flex:1;min-height:0">
            <label style="display:block;font-size:12px;opacity:.75">Provider</label>
            <select id="setProvider" style="width:100%;min-height:40px;margin:4px 0 8px;padding:8px;border-radius:8px;background:#120f22;color:#fff;border:1px solid #445"></select>
            <label style="display:block;font-size:12px;opacity:.75">API key</label>
            <input type="password" id="setApiKey" placeholder="sk-…" autocomplete="off" style="width:100%;min-height:40px;margin:4px 0 8px;padding:8px;border-radius:8px;background:#120f22;color:#fff;border:1px solid #445">
            <p id="setKeyHint" style="font-size:12px;opacity:.65;margin:0 0 8px"></p>
            <label style="display:block;font-size:12px;opacity:.75">Base URL (custom / local)</label>
            <input type="text" id="setBaseUrl" placeholder="https://…" style="width:100%;min-height:40px;margin:4px 0 8px;padding:8px;border-radius:8px;background:#120f22;color:#fff;border:1px solid #445">
            <label style="display:block;font-size:12px;opacity:.75">Model</label>
            <select id="setModel" style="width:100%;min-height:40px;margin:4px 0 8px;padding:8px;border-radius:8px;background:#120f22;color:#fff;border:1px solid #445"><option value="auto">auto</option></select>
            <label style="display:block;font-size:12px;opacity:.75">Mode</label>
            <select id="setMode" style="width:100%;min-height:40px;margin:4px 0 8px;padding:8px;border-radius:8px;background:#120f22;color:#fff;border:1px solid #445">
              <option value="cloud_enabled">Cloud enabled</option>
              <option value="local_only">Local only</option>
            </select>
            <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:8px">
              <button type="button" id="setSave" style="min-height:40px;padding:0 14px;border-radius:10px;border:0;background:#3b82f6;color:#fff;font-weight:600;cursor:pointer">Save</button>
              <button type="button" id="setTest" style="min-height:40px;padding:0 14px;border-radius:10px;border:1px solid #445;background:#1a1a24;color:#fff;cursor:pointer">Test</button>
              <button type="button" id="setModels" style="min-height:40px;padding:0 14px;border-radius:10px;border:1px solid #445;background:#1a1a24;color:#fff;cursor:pointer">Models</button>
            </div>
            <p id="setStatus" style="font-size:13px;opacity:.85;margin-top:10px"></p>
          </div>
        </div>
        <div class="tab-pane" id="pane-logs" hidden>
          <div class="logs-toolbar"><button type="button" id="logsRefresh">Refresh</button><button type="button" id="logsClear">Clear</button></div>
          <pre class="logs-view" id="logsView"></pre>
        </div>
      </div>
    </div>
  </div>

  <script src="/ai-module/ai-module.js"></script>
  <script src="/feedback-module/feedback-module.js"></script>
  <script src="/reader-injector.js"></script>
  <script src="/ai-panel.js"></script>
  <script src="/app.js"></script>
</body>
</html>
