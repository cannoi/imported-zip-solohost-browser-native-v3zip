title: "SoloHost Browser"
eyebrow: SoloHost App
description: "Simple · Private · Lightweight browser for SoloHost."
footer_hint: Optional password for public IP access. Leave empty for local use.
output_file: .env
after_save: Saved. Start the app from SoloHost.
fields:
  - name: BROWSER_ACCESS_PASSWORD
    label: Access password (public IP)
    type: password
    required: false
    preserve_if_blank: true
    help: "Only needed when opening the app via public IP. Leave empty for local/LAN."
    default: ""
fixed_values:
  - name: TZ
    value: "UTC"
