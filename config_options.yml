title: "SoloHost Browser"
eyebrow: SoloHost App
description: "Simple private lightweight browser with AI tasks and music library."
footer_hint: Set access password for public IP remote access. Empty allows local/LAN only.
output_file: .env
after_save: Saved. Restart the app from SoloHost.
fields:
  - name: BROWSER_ACCESS_PASSWORD
    label: Browser access password (required for public IP)
    type: password
    required: false
    help: "Required when opening the app via public IP. Local SoloHost can leave empty."
    default: ""

  - name: AGENT_TIME_LIMIT_MIN
    label: AI Agent time limit (minutes)
    type: number
    preserve_if_blank: true
    help: "Max minutes per AI Agent task (default 60)."
