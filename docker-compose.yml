services:
  web:
    build: .
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      HOME: "/tmp/solohost-browser"
      SOLOHOST_BROWSER_DATA: "/app/data/webkit-profile"
      SOLOHOST_DOWNLOADS: "/app/data/webkit-profile/downloads"
      SOLOHOST_NAV_TIMEOUT_MS: "30000"
      PLAYWRIGHT_BROWSERS_PATH: "/ms-playwright"
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    shm_size: "1gb"
    init: true
    restart: unless-stopped
    labels:
      pi.ui.primary: "true"
    volumes:
      - solohost-browser-data:/app/data
volumes:
  solohost-browser-data:
