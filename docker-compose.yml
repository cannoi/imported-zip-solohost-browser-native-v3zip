services:
  web:
    build: .
    image: ghcr.io/cannoi/imported-zip-solohost-browser-native-v3zip:latest
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      HOST: "0.0.0.0"
      HOME: "/tmp/solohost-browser"
      SOLOHOST_PLAYWRIGHT: "1"
      SOLOHOST_WEBKIT: "0"
      SOLOHOST_WEBKIT_BRIDGE: "0"
      SOLOHOST_DATA_DIR: "/app/data"
    restart: unless-stopped
    labels:
      pi.ui.primary: "true"
    volumes:
      - solohost-browser-data:/app/data

volumes:
  solohost-browser-data:
